[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tarf-rslv-pricer"
version = "0.1.0"
description = "Finite-difference TARF pricer with a 3-regime local-vol extension"
readme = "README.md"
# Front Arena runs an embedded CPython 3.9.7 that cannot be upgraded, so this
# branch targets that interpreter and the library versions shipped with it.
requires-python = ">=3.9"
dependencies = [
  "numpy==1.22.4",
  "scipy==1.13.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
